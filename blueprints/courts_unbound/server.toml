# Courts Unbound — ACOTAR AU play-by-post (TWF system, FFJ procedures, wodSouls market & sagas).
#
#   python -m vault build 1458172912426287126 blueprints/courts_unbound --dry-run --prune-roles
#
# Words in presets map to Discord permissions (vault/services/blueprint.py, Permission).
# In forums "send" creates posts and "send_in_threads" replies inside them.
# Docs use {#channel-id} for channel links and {@Role} for role mentions; posts never ping.

[server]
name = "ACOTAR: Courts Unbound"

# ---------------------------------------------------------------- access presets

# Readable before any role is given: rules, getting started, the encyclopedia.
[presets.public]
"@everyone" = { allow = ["view", "history", "react"], deny = ["send", "send_in_threads", "create_public_threads", "create_private_threads"] }
"Staff" = { allow = ["send", "send_in_threads", "embed", "attach", "manage_messages"] }
"Bots" = { allow = ["send", "embed", "attach", "manage_messages"] }

# Members read; staff and storytellers post.
[presets.notices]
"@everyone" = { deny = ["view"] }
"New Arrival" = { allow = ["view", "history", "react"], deny = ["send", "send_in_threads", "create_public_threads", "create_private_threads"] }
"Member" = { allow = ["view", "history", "react"], deny = ["send", "send_in_threads", "create_public_threads", "create_private_threads"] }
"Spectator" = { allow = ["view", "history", "react"], deny = ["send", "send_in_threads", "create_public_threads", "create_private_threads"] }
"Approved Player" = { allow = ["view", "history", "react"], deny = ["send", "send_in_threads", "create_public_threads", "create_private_threads"] }
"Storyteller" = { allow = ["view", "history", "send", "embed", "attach"] }
"Staff" = { allow = ["view", "history", "send", "send_in_threads", "embed", "attach", "manage_messages", "mention_everyone"] }
"Bots" = { allow = ["view", "history", "send", "embed", "attach"] }

# New arrivals wait here for review.
[presets.intake]
"@everyone" = { deny = ["view"] }
"New Arrival" = { allow = ["view", "history", "send", "react"] }
"Staff" = { allow = ["view", "history", "send", "manage_messages"] }
"Bots" = { allow = ["view", "history", "send", "embed"] }

# Forums where accepted members and players open their own posts (character profiles).
# New arrivals read until their application is accepted.
[presets.applicants]
"@everyone" = { deny = ["view"] }
"New Arrival" = { allow = ["view", "history"], deny = ["send", "send_in_threads"] }
"Member" = { allow = ["view", "history", "send", "send_in_threads", "embed", "attach", "react"] }
"Approved Player" = { allow = ["view", "history", "send", "send_in_threads", "embed", "attach", "react"] }
"Spectator" = { allow = ["view", "history"], deny = ["send", "send_in_threads"] }
"Staff" = { allow = ["view", "history", "send", "send_in_threads", "embed", "attach", "manage_messages", "manage_threads"] }
"Bots" = { allow = ["view", "history", "send", "send_in_threads", "embed"] }

# Forums where approved players open posts (ledgers, plotters, purses, sagas).
[presets.player-forum]
"@everyone" = { deny = ["view"] }
"New Arrival" = { allow = ["view", "history"], deny = ["send", "send_in_threads"] }
"Member" = { allow = ["view", "history"], deny = ["send", "send_in_threads"] }
"Spectator" = { allow = ["view", "history"], deny = ["send", "send_in_threads"] }
"Approved Player" = { allow = ["view", "history", "send", "send_in_threads", "embed", "attach", "react"] }
"Storyteller" = { allow = ["view", "history", "send", "send_in_threads", "embed", "attach"] }
"Staff" = { allow = ["view", "history", "send", "send_in_threads", "embed", "attach", "manage_messages", "manage_threads"] }
"Bots" = { allow = ["view", "history", "send", "send_in_threads", "embed"] }

# Staff and storytellers open posts; accepted members reply inside them (claims, missions).
[presets.registers]
"@everyone" = { deny = ["view"] }
"New Arrival" = { allow = ["view", "history"], deny = ["send", "send_in_threads"] }
"Member" = { allow = ["view", "history", "send_in_threads", "react"], deny = ["send"] }
"Approved Player" = { allow = ["view", "history", "send_in_threads", "embed", "attach", "react"], deny = ["send"] }
"Spectator" = { allow = ["view", "history"], deny = ["send", "send_in_threads"] }
"Storyteller" = { allow = ["view", "history", "send", "send_in_threads", "embed", "attach"] }
"Staff" = { allow = ["view", "history", "send", "send_in_threads", "embed", "attach", "manage_messages", "manage_threads"] }
"Bots" = { allow = ["view", "history", "send", "send_in_threads", "embed"] }

# In-character locations.
[presets.rp]
"@everyone" = { deny = ["view"] }
"Approved Player" = { allow = ["view", "history", "send", "send_in_threads", "create_public_threads", "create_private_threads", "embed", "attach", "react"] }
"Spectator" = { allow = ["view", "history", "react"], deny = ["send", "send_in_threads", "create_public_threads", "create_private_threads"] }
"Storyteller" = { allow = ["view", "history", "send", "send_in_threads", "create_public_threads", "create_private_threads", "embed", "attach", "manage_threads"] }
"Staff" = { allow = ["view", "history", "send", "send_in_threads", "create_public_threads", "create_private_threads", "embed", "attach", "manage_messages", "manage_threads"] }
"Bots" = { allow = ["view", "history", "send", "send_in_threads", "embed"] }

# Approved players post, spectators read (grading inbox, trading, travel, looking for RP).
[presets.players]
"@everyone" = { deny = ["view"] }
"Approved Player" = { allow = ["view", "history", "send", "send_in_threads", "create_public_threads", "embed", "attach", "react"] }
"Spectator" = { allow = ["view", "history", "react"], deny = ["send", "send_in_threads", "create_public_threads"] }
"Storyteller" = { allow = ["view", "history", "send", "send_in_threads", "embed", "attach"] }
"Staff" = { allow = ["view", "history", "send", "send_in_threads", "embed", "attach", "manage_messages", "manage_threads"] }
"Bots" = { allow = ["view", "history", "send", "embed"] }

# Everyone with a role chats, voice included.
[presets.ooc]
"@everyone" = { deny = ["view"] }
"New Arrival" = { allow = ["view", "history", "send", "send_in_threads", "create_public_threads", "embed", "attach", "react", "connect", "speak"] }
"Member" = { allow = ["view", "history", "send", "send_in_threads", "create_public_threads", "embed", "attach", "react", "connect", "speak"] }
"Spectator" = { allow = ["view", "history", "send", "send_in_threads", "create_public_threads", "embed", "attach", "react", "connect", "speak"] }
"Approved Player" = { allow = ["view", "history", "send", "send_in_threads", "create_public_threads", "embed", "attach", "react", "connect", "speak"] }
"Staff" = { allow = ["view", "history", "send", "send_in_threads", "create_public_threads", "embed", "attach", "react", "connect", "speak", "manage_messages", "manage_threads"] }
"Bots" = { allow = ["view", "history", "send", "send_in_threads", "embed", "attach", "connect", "speak"] }

# One allegiance's private hall; each channel grants its allegiance role.
[presets.court-hall]
"@everyone" = { deny = ["view"] }
"$grant" = { allow = ["view", "history", "send", "send_in_threads", "create_public_threads", "embed", "attach", "react"] }
"Staff" = { allow = ["view", "history", "send", "manage_messages", "manage_threads"] }

# 21+ opt-in: NSFW Romance holders open private threads; nothing is posted in the channel itself.
[presets.mature]
"@everyone" = { deny = ["view"] }
"NSFW Romance" = { allow = ["view", "history", "create_private_threads", "send_in_threads", "embed", "attach", "react"], deny = ["send", "create_public_threads"] }
"Staff" = { allow = ["view", "history", "send", "send_in_threads", "manage_messages", "manage_threads"] }

# Staff only; a channel may grant one more role (storytellers in the story workshop).
[presets.staff]
"@everyone" = { deny = ["view"] }
"Staff" = { allow = ["view", "history", "send", "send_in_threads", "create_public_threads", "create_private_threads", "embed", "attach", "react", "connect", "speak", "manage_messages", "manage_threads"] }
"Bots" = { allow = ["view", "history", "send", "send_in_threads", "embed", "attach"] }
"$grant" = { allow = ["view", "history", "send", "send_in_threads", "embed", "attach", "react"] }

# Read-only history.
[presets.archive]
"@everyone" = { deny = ["view"] }
"Approved Player" = { allow = ["view", "history"], deny = ["send", "send_in_threads", "create_public_threads", "create_private_threads"] }
"Spectator" = { allow = ["view", "history"], deny = ["send", "send_in_threads", "create_public_threads", "create_private_threads"] }
"Staff" = { allow = ["view", "history", "send", "send_in_threads", "manage_messages", "manage_threads"] }

# The archive, closed to every role as staff set it on Discord; people opened to it keep their own overwrites.
[presets.archive-hidden]
"@everyone" = { deny = ["view"] }
"Approved Player" = { allow = ["history"], deny = ["view", "send", "send_in_threads", "create_public_threads", "create_private_threads"] }
"Spectator" = { allow = ["history"], deny = ["view", "send", "send_in_threads", "create_public_threads", "create_private_threads"] }
"Staff" = { allow = ["history", "send", "send_in_threads", "manage_messages", "manage_threads"], deny = ["view"] }

